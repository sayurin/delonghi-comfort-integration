name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package after release approval
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Require explicit release clearance
        env:
          RELEASE_APPROVED: ${{ vars.DELONGHI_RELEASE_APPROVED }}
        run: |
          if [ "$RELEASE_APPROVED" != true ]; then
            echo "::error::Release is on hold. Resolve NOTICE/API prerequisites and obtain human approval before enabling DELONGHI_RELEASE_APPROVED."
            exit 1
          fi
      - name: Validate tag format
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - uses: home-assistant/actions/hassfest@master
      - name: Validate version and build committed archives
        run: python scripts/build_release.py "$RELEASE_TAG"
      - name: Create draft release for human review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "De'Longhi Comfort $RELEASE_TAG" \
            --generate-notes \
            dist/delonghi_comfort.zip \
            "dist/delonghi-comfort-integration-$RELEASE_TAG.zip"
