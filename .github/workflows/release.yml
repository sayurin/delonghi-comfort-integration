name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to rebuild, for example v0.2.1
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require GitHub App configuration
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure APP_ID and APP_PRIVATE_KEY for the repository's release GitHub App."
            exit 1
          fi
      - uses: actions/create-github-app-token@v2.2.2
        id: app
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@v4.4.1
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main

  package:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: 0.13.1
      - name: Install minimum-version test environment
        run: uv sync --locked --extra dev --extra ha-minimum
      - name: Run offline regression tests
        run: uv run --locked --extra dev --extra ha-minimum pytest
      - uses: home-assistant/actions/hassfest@master
      - name: Build integration ZIP
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          python scripts/build_release.py
      - name: Attach ZIP to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]
          gh release upload "$RELEASE_TAG" dist/delonghi_comfort.zip --clobber

  recover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: 0.13.1
      - name: Install minimum-version test environment
        run: uv sync --locked --extra dev --extra ha-minimum
      - name: Offline regression tests
        run: uv run --locked --extra dev --extra ha-minimum pytest
      - uses: home-assistant/actions/hassfest@master
      - name: Validate release tag and draft status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release="$(gh release view "$RELEASE_TAG" --json isDraft,tagName)"
          [ "$(jq -r .isDraft <<<"$release")" = true ]
          [ "$(jq -r .tagName <<<"$release")" = "$RELEASE_TAG" ]
      - name: Resolve release commit
        id: revision
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: echo "sha=$(git rev-parse "$RELEASE_TAG^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Build integration ZIP
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: python scripts/build_release.py
      - name: Replace ZIP on draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --json isDraft,tagName)"
          [ "$(jq -r .isDraft <<<"$release")" = true ]
          [ "$(jq -r .tagName <<<"$release")" = "$RELEASE_TAG" ]
          gh release upload "$RELEASE_TAG" dist/delonghi_comfort.zip --clobber
