name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require GitHub App configuration
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure APP_ID and APP_PRIVATE_KEY for the repository's release GitHub App."
            exit 1
          fi
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main
          # Keep maintaining the PR while publication is on hold.
          skip-github-release: ${{ vars.DELONGHI_RELEASE_APPROVED != 'true' }}
      - name: Report release hold
        if: vars.DELONGHI_RELEASE_APPROVED != 'true'
        run: echo "::notice::Release PR maintenance only. Resolve NOTICE/API prerequisites before enabling DELONGHI_RELEASE_APPROVED and merging the release PR."

  package:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - uses: home-assistant/actions/hassfest@master
      - name: Build integration ZIP
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          tag = os.environ["RELEASE_TAG"]
          revision = os.environ["RELEASE_SHA"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise ValueError("Release tag must be vMAJOR.MINOR.PATCH")
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise ValueError("Release revision must be a full commit SHA")
          manifest_path = "custom_components/delonghi_comfort"
          def committed(path):
              return subprocess.check_output(["git", "show", f"{revision}:{path}"])
          manifest = json.loads(committed(f"{manifest_path}/manifest.json"))
          if manifest["version"] != tag.removeprefix("v"):
              raise ValueError("Release tag does not match the committed manifest version")
          if committed("version.txt").decode().strip() != manifest["version"]:
              raise ValueError("Release version files disagree")
          documents = {name: committed(name) for name in ("LICENSE", "NOTICE")}
          output = Path("dist/delonghi_comfort.zip")
          output.parent.mkdir(exist_ok=True)
          subprocess.run(
              ["git", "archive", "--format=zip", "--mtime=1980-01-01T00:00:00Z", f"--output={output}",
               f"{revision}:{manifest_path}"], check=True,
          )
          with ZipFile(output, "a", compression=ZIP_DEFLATED) as archive:
              for info in archive.infolist():
                  path = Path(info.filename)
                  if (
                      path.is_absolute() or ".." in path.parts
                      or "__pycache__" in path.parts
                      or path.suffix in (".pyc", ".pyo")
                      or (info.external_attr >> 16) & 0o170000 == 0o120000
                  ):
                      raise ValueError("Unexpected integration archive member")
              for name, content in documents.items():
                  if name in archive.namelist():
                      raise ValueError("Duplicate license document in integration archive")
                  info = ZipInfo(name)
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, content)
              if not {"manifest.json", "__init__.py", "LICENSE", "NOTICE"} <= set(archive.namelist()):
                  raise ValueError("Required integration archive members are missing")
          PY
      - name: Attach ZIP to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]
          gh release upload "$RELEASE_TAG" dist/delonghi_comfort.zip --clobber
